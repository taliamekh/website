<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GT3 RS — wheel coloring review</title>
<style>
  body{margin:0;background:#f4f4f6;color:#1b1b22;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:20px;padding:28px 16px}
  h1{font-size:17px;margin:0;text-align:center}
  .sub{font-size:13px;color:#666;margin:0;text-align:center;max-width:600px;line-height:1.5}
  .card{width:560px;max-width:94vw;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:6px}
  .white{background:#fff;border:1px solid #e3e3ea}
  .tile{background:radial-gradient(ellipse at 0% 100%,rgba(249,168,212,.34),transparent 55%),radial-gradient(ellipse at 100% 0%,rgba(186,230,253,.16),transparent 52%),linear-gradient(135deg,#241027,#3a1733,#2e1431)}
  .small{width:170px;height:170px;padding:0}
  .cap{font-size:11px;color:#8a8a95;margin:-10px 0 0}
  img{width:100%;display:block}
</style></head><body>
  <h1>Wheels recolored with the region method — sizing check</h1>
  <p class="sub">Tire ring + spoke-face are filled from your drawing's actual enclosed regions (same as the glass), so they're sized to your art — no stamped circles.</p>
  <div class="card white"><img src="_final2.svg?v=10" alt="car on white"></div>
  <div class="cap">on white</div>
  <div class="card tile"><img src="_final2.svg?v=10" alt="car on tile"></div>
  <div class="cap">on the wine tile</div>
  <div class="card tile small"><img src="_final2.svg?v=10" alt="car at tile size"></div>
  <div class="cap">150px — actual tile size</div>
</body></html>
