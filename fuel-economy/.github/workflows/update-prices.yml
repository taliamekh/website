name: Refresh gas prices

# Runs every day at 11:00 UTC (~7am ET). Also runnable manually from the Actions tab.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run price refresh
        run: node scripts/update-prices.mjs

      - name: Commit if prices changed
        run: |
          if [ -n "$(git status --porcelain data/prices.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.json
            git commit -m "chore: refresh gas prices ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No price changes."
          fi
