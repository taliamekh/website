<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Talia Mekhayche</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Sora:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Roboto+Mono:wght@400;500;600;700&family=Fira+Code:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Inconsolata:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ─── BASE THEME — AURORA ROYAL (locked) ─── */
  :root {
    --bg: #170a1c;
    --deep: #21102a;
    --panel: #2e1640;
    --panel-hi: #3d2055;
    --border: #4a2a68;
    --border2: #6f44a0;
    --accent: #c084fc;        /* lavender — used for hero name pop, footer, default */
    --accent-2: #fbbf24;      /* gold — secondary */
    --pink: #e879f9;
    --text: #ecdef7;          /* light purple — pops against wine bg */
    --text-muted: #b09bc8;
    --text-dim: #7a6588;
    --white: #fffaf3;
    --grid-1: rgba(192, 132, 252, 0.045);
    --grid-2: rgba(251, 191, 36, 0.025);
    --grid-3: rgba(192, 132, 252, 0.055);
    --tag-font: 'Roboto Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Outfit', sans-serif; font-weight: 300; line-height: 1.7;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--grid-1) 1px, transparent 2px),
      linear-gradient(90deg, var(--grid-2) 1px, transparent 2px),
      linear-gradient(var(--grid-3) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-2) 1px, transparent 2px);
    background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    pointer-events: none; z-index: 0;
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 48px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.01em; color: var(--white); text-decoration: none; }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 4px; list-style: none; }
  .nav-links a {
    padding: 7px 15px; font-family: var(--tag-font); font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase;
    text-decoration: none; color: var(--text-muted); border-radius: 4px;
    transition: color 0.2s, background 0.2s;
  }
  .nav-links a:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .nav-links a.active { color: var(--accent); }

  /* ─── STICKY PALETTE PICKER (20 project color palettes) ─── */
  .controls {
    position: sticky; top: 64px; z-index: 50;
    background: color-mix(in srgb, var(--bg) 95%, transparent);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 12px 32px;
  }
  .controls-inner {
    max-width: 1340px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 10px;
  }
  .control-row {
    display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap;
  }
  .control-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent);
    flex-shrink: 0; padding-top: 8px; max-width: 120px;
  }
  .control-options {
    display: flex; gap: 6px; flex-wrap: wrap;
    flex: 1;
  }
  .opt {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.05em;
    padding: 6px 10px; border-radius: 5px;
    cursor: pointer; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 8px;
    line-height: 1;
  }
  .opt:hover { border-color: var(--border2); color: var(--white); }
  .opt.active {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--panel));
    color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .opt .swatch {
    display: inline-flex;
    width: 48px; height: 12px;
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .opt .swatch span { flex: 1; }

  /* ─── PROJECTS ─── */
  #projects {
    max-width: 1700px; margin: 0 auto;
    padding: 80px 48px 100px;
    position: relative; z-index: 1;
  }
  #projects::before {
    content: ''; position: absolute;
    top: 36px; left: 50%; transform: translateX(-50%);
    width: 60px; height: 2px;
    background: var(--palette-gradient, var(--accent)); border-radius: 2px;
  }
  .projects-header {
    margin-bottom: 36px;
    display: flex; align-items: baseline; gap: 16px;
  }
  .projects-title {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 64px;
    color: var(--white);
    letter-spacing: -0.025em;
    line-height: 1;
  }
  .projects-line { flex: 1; height: 1px; background: var(--border); align-self: center; }

  /* ─── BENTO ─── */
  .bento {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-auto-rows: 240px;
    gap: 16px;
    perspective: 1800px;
    grid-auto-flow: dense;
  }
  .tile {
    --pop: var(--tile-accent, var(--accent));
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.5s cubic-bezier(0.22,1,0.36,1),
                border-color 0.4s,
                box-shadow 0.5s;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .tile.tilting {
    transition: transform 0.06s linear, border-color 0.4s, box-shadow 0.5s;
  }
  .tile:hover {
    border-color: var(--pop);
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--pop) 80%, transparent),
      0 0 40px color-mix(in srgb, var(--pop) 50%, transparent),
      0 0 110px 18px color-mix(in srgb, var(--pop) 22%, transparent),
      0 8px 32px rgba(0, 0, 0, 0.45);
    z-index: 5;
  }

  .tile-img { position: absolute; inset: 0; transform: translateZ(0); }
  .tile-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease;
  }
  .tile:hover .tile-img img { transform: scale(1.04); }
  .tile-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      transparent 0%,
      transparent 28%,
      rgba(8, 4, 14, 0.55) 55%,
      rgba(8, 4, 14, 0.88) 78%,
      rgba(8, 4, 14, 0.96) 100%);
  }
  .tile-name, .tile-summary {
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
  }

  .tile-content {
    position: absolute; inset: 0;
    padding: 22px;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    z-index: 4;
    transform: translateZ(0);
    will-change: transform;
    backface-visibility: hidden;
  }
  .tile-num {
    font-family: var(--tag-font);
    font-size: 11px;
    color: var(--pop);
    letter-spacing: 0.18em;
    font-weight: 600;
  }
  .tile-bottom { display: flex; flex-direction: column; gap: 10px; }

  .tile-awards {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
  }

  .tile-award {
    align-self: flex-start;
    font-family: var(--tag-font);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    letter-spacing: 0.05em;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    color: var(--pop);
    border: 1px solid color-mix(in srgb, var(--pop) 70%, transparent);
    background: color-mix(in srgb, var(--pop) 22%, var(--panel));
  }

  .tile-name {
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--white);
    line-height: 1.15;
    letter-spacing: -0.015em;
  }
  .tile.large .tile-name { font-size: 30px; }
  .tile-summary {
    font-size: 12px;
    color: color-mix(in srgb, var(--text) 88%, transparent);
    line-height: 1.5;
  }

  .tile-tags {
    display: flex; gap: 5px; flex-wrap: wrap;
    margin-top: 4px;
  }
  .tile-tag {
    font-family: var(--tag-font);
    font-size: 10px;
    font-weight: 500;
    padding: 3px 9px;
    background: color-mix(in srgb, var(--pop) 14%, var(--bg));
    color: var(--pop);
    border: 1px solid color-mix(in srgb, var(--pop) 45%, transparent);
    border-radius: 4px;
    letter-spacing: 0.04em;
  }

  .tile.size-2x2  { grid-column: span 2; grid-row: span 3; }
  .tile.size-tall { grid-column: span 2; grid-row: span 2; }
  .tile.size-wide { grid-column: span 6; grid-row: span 1; }
  .tile.size-mid  { grid-column: span 2; grid-row: span 1; }

  /* DESKTOP EXPLICIT GRID PLACEMENT */
  .bento .tile[data-id="deskclaw"]      { grid-column: 1 / 3 !important; grid-row: 1 / 4 !important; }
  .bento .tile[data-id="sleep-apnea"]   { grid-column: 3 / 5 !important; grid-row: 1 / 3 !important; }
  .bento .tile[data-id="spocket"]       { grid-column: 5 / 7 !important; grid-row: 1 / 3 !important; }
  .bento .tile[data-id="water-filter"]  { grid-column: 7 / 9 !important; grid-row: 1 / 4 !important; }
  .bento .tile[data-id="wind-turbine"]  { grid-column: 3 / 5 !important; grid-row: 3 / 4 !important; }
  .bento .tile[data-id="haptic-gloves"] { grid-column: 5 / 7 !important; grid-row: 3 / 4 !important; }

  .bento .tile[data-id="sleep-apnea"] .tile-img img {
    object-fit: cover !important;
    object-position: 50% 100% !important;
    transform: scale(1.35);
    transform-origin: center bottom;
  }
  .bento .tile[data-id="sleep-apnea"]:hover .tile-img img {
    transform: scale(1.4);
  }

  /* ─── SPOCKET tile: inline SVG cover so the arm can wave on hover ─── */
  .bento .tile[data-id="spocket"] .tile-img svg {
    width: 100%; height: 100%;
    display: block;
  }
  .bento .tile[data-id="spocket"] .spocket-arm-left {
    transform-origin: 14px 7px;
    transform: rotate(8deg);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .bento .tile[data-id="spocket"] .spocket-arm-right {
    transform-origin: 14px 7px;
    transform: rotate(-8deg);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .bento .tile[data-id="spocket"]:hover .spocket-arm-left {
    animation: spocket-wave 1.4s ease-in-out;
  }
  @keyframes spocket-wave {
    0%   { transform: rotate(8deg); }
    15%  { transform: rotate(-55deg); }
    30%  { transform: rotate(-25deg); }
    45%  { transform: rotate(-55deg); }
    60%  { transform: rotate(-25deg); }
    75%  { transform: rotate(-50deg); }
    100% { transform: rotate(8deg); }
  }

  .tile.no-image .tile-img,
  .tile.no-image .tile-overlay { display: none; }
  .tile.no-image {
    background:
      radial-gradient(ellipse at 0% 100%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 55%),
      radial-gradient(ellipse at 100% 0%, color-mix(in srgb, var(--pop) 24%, transparent), transparent 55%),
      var(--panel);
  }
  .tile.no-image::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, color-mix(in srgb, var(--text) 18%, transparent) 1px, transparent 1.5px);
    background-size: 26px 26px;
    opacity: 0.32;
    pointer-events: none;
    z-index: 0;
  }
  .tile.no-image .tile-content { z-index: 2; }

  .arrow {
    position: absolute;
    top: 16px; right: 16px;
    z-index: 5;
    transform: translateX(20px);
    font-family: var(--tag-font);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bg);
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--pop);
    opacity: 0;
    transition: opacity 0.3s, transform 0.4s cubic-bezier(0.22,1,0.36,1);
    font-weight: 700;
    pointer-events: none;
    box-shadow: 0 4px 16px color-mix(in srgb, var(--pop) 40%, transparent);
  }
  .arrow::before { content: 'View project'; }
  .arrow::after { content: ' →'; }
  .tile:hover .arrow {
    opacity: 1;
    transform: translateX(0);
  }

  /* ─── BOTTOM SHEET MODAL ─── */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 200;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal-sheet {
    --pop: var(--tile-accent, var(--accent));
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 210;
    height: 92vh;
    background: var(--bg);
    border-top: 2px solid var(--pop);
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    transform: translateY(100%);
    transition: transform 0.45s cubic-bezier(0.22,1,0.36,1);
    display: flex; flex-direction: column;
  }
  .modal-sheet.open { transform: translateY(0); }
  .modal-handle { flex-shrink: 0; text-align: center; padding: 14px 0 6px; }
  .modal-handle::before {
    content: ''; display: inline-block;
    width: 60px; height: 4px; border-radius: 999px;
    background: var(--border2);
  }
  .modal-bar {
    flex-shrink: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 32px 14px; border-bottom: 1px solid var(--border);
  }
  .modal-bar-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: var(--pop); font-weight: 600; }
  .modal-close {
    background: var(--panel); border: 1px solid var(--border2); color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 8px 14px; border-radius: 4px; cursor: pointer;
  }
  .modal-close:hover { border-color: var(--pop); color: var(--pop); }
  .modal-body { overflow-y: auto; padding: 36px 48px 60px; }
  .modal-body-inner { max-width: 1000px; margin: 0 auto; }

  .modal-sheet .p-awards { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .modal-sheet .p-award {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600;
    padding: 5px 14px; border-radius: 999px;
    letter-spacing: 0.05em;
    color: var(--pop);
    border: 1px solid color-mix(in srgb, var(--pop) 60%, transparent);
    background: color-mix(in srgb, var(--pop) 14%, transparent);
  }
  .modal-sheet .p-award.silver { color: #e8edf5; border-color: rgba(232,237,245,0.45); background: rgba(232,237,245,0.10); }
  .modal-sheet .p-award.neutral { color: var(--text-muted); border-color: var(--border2); background: transparent; }
  .modal-sheet .p-title {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: clamp(36px, 5vw, 64px);
    color: var(--white); line-height: 1.05;
    letter-spacing: -0.025em;
    margin-bottom: 24px;
  }
  .modal-sheet .p-desc { font-size: 16px; line-height: 1.8; color: var(--text); margin-bottom: 14px; max-width: 880px; }
  .modal-sheet .p-label {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--pop); margin: 32px 0 14px;
    padding-left: 14px; border-left: 2px solid var(--pop);
  }
  .modal-sheet .p-points { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .modal-sheet .p-points li { font-size: 14px; color: var(--text); padding-left: 20px; position: relative; line-height: 1.65; }
  .modal-sheet .p-points li::before { content: '▸'; position: absolute; left: 0; top: 2px; color: var(--pop); }
  .modal-sheet .p-points li strong { color: var(--white); font-weight: 500; }
  .modal-sheet .p-photos {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px; margin-top: 28px;
  }
  .modal-sheet .p-photo {
    border-radius: 10px;
    overflow: hidden;
    background: var(--deep);
    border: 1px solid var(--border);
  }
  .modal-sheet .p-photo img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: contain;
    display: block;
    background: var(--deep);
    cursor: zoom-in;
    transition: transform 0.25s ease;
  }
  .modal-sheet .p-photo img:hover { transform: scale(1.015); }

  /* ─── IMAGE LIGHTBOX ─── */
  .lightbox {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0, 0, 0, 0.94);
    display: flex; align-items: center; justify-content: center;
    padding: 60px 32px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    cursor: zoom-out;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
    transform: scale(0.96);
    transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  .lightbox.open .lightbox-img { transform: scale(1); }
  .lightbox-caption {
    position: absolute;
    left: 0; right: 0; bottom: 24px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    padding: 0 32px;
  }
  .lightbox-close {
    position: absolute; top: 18px; right: 18px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .lightbox-close:hover { background: rgba(255, 255, 255, 0.18); }
  .modal-sheet .p-photo figcaption {
    padding: 8px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
  }
  .modal-sheet .p-tags {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-top: 24px; padding-top: 22px;
    border-top: 1px solid var(--border);
  }
  .modal-sheet .p-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    padding: 4px 10px; border-radius: 4px;
    background: color-mix(in srgb, var(--pop) 14%, transparent);
    color: var(--pop);
    border: 1px solid color-mix(in srgb, var(--pop) 35%, transparent);
    font-weight: 500;
  }

  /* Spocket */
  .spocket-stage {
    margin-top: 24px; padding: 24px; border-radius: 14px;
    background: linear-gradient(145deg, color-mix(in srgb, var(--pink) 14%, transparent), color-mix(in srgb, var(--pop) 8%, transparent));
    border: 1px solid color-mix(in srgb, var(--pink) 40%, transparent);
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  }
  .spocket-face { width: 80px; flex-shrink: 0; }
  .spocket-face svg { width: 100%; height: auto; }
  .spocket-msg { flex: 1; min-width: 220px; }
  .spocket-whisper { display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--pink); margin-bottom: 8px; }
  .spocket-msg p { font-size: 14px; line-height: 1.6; color: var(--text); }
  .spocket-hi { color: color-mix(in srgb, var(--pink) 90%, var(--white)); font-weight: 500; }
  .spocket-cta {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 14px; padding: 12px 22px;
    font-family: var(--tag-font); font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase;
    font-weight: 700;
    color: #3d1f47;
    text-decoration: none; border-radius: 999px;
    background: linear-gradient(100deg, #fce7f3 0%, #fbcfe8 50%, #f9a8d4 100%);
    box-shadow: 0 4px 18px rgba(249, 168, 212, 0.35);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .spocket-cta:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 22px rgba(249, 168, 212, 0.5);
  }

const bento = document.getElementById('bento');
bento.innerHTML = tileOrder.map(id => {
  const p = PROJECTS.find(x => x.id === id);
  const size = sizes[id];
  const limit = tagLimit[size] || 3;
  const visibleTags = p.tags.slice(0, limit);
  const tagsHTML = visibleTags.map(t => `<span class="tile-tag">${t}</span>`).join('');
  const awardsBlock = (p.awards && p.awards.length)
    ? `<div class="tile-awards">${p.awards.map(a => `<span class="tile-award ${a.kind}">${a.text}</span>`).join('')}</div>`
    : '';
  const coverHTML = id === 'spocket'
    ? SPOCKET_SVG
    : `<img src="${p.cover}" alt="${p.title}">`;
  return `
    <article class="tile ${size} ${noImage[id] ? 'no-image' : ''} ${p.awards.length > 1 ? 'large' : ''}" data-id="${p.id}" data-num="${p.num}" onclick="openModal('${p.id}')">
      <div class="tile-img">${coverHTML}</div>
      <div class="tile-overlay"></div>
      <div class="tile-content">
        <div class="tile-bottom">
          ${awardsBlock}
          <h3 class="tile-name">${p.title}</h3>
          <p class="tile-summary">${p.summary}</p>
          <div class="tile-tags">${tagsHTML}</div>
        </div>
      </div>
      <div class="arrow"></div>
    </article>
  `;
}).join('');

/* ─── SUBTLE 3D TILT ─── */
document.querySelectorAll('.tile').forEach(tile => {
  tile.addEventListener('mousemove', e => {
    const r = tile.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    const ry = (x - 0.5) * 3.5;
    const rx = (0.5 - y) * 3.5;
    tile.classList.add('tilting');
    tile.style.transform = `perspective(1800px) rotateX(${rx}deg) rotateY(${ry}deg)`;
  });
  tile.addEventListener('mouseleave', () => {
    tile.classList.remove('tilting');
    tile.style.transform = '';
  });
});

function setPalette(id) {
  const palette = palettes.find(p => p.id === id);
  if (!palette) return;
  Object.entries(palette.colors).forEach(([projectId, color]) => {
    const tile = document.querySelector(`.tile[data-id="${projectId}"]`);
    if (tile) tile.style.setProperty('--tile-accent', color);
  });
  const colorArr = tileOrder.map(pid => palette.colors[pid]);
  document.documentElement.style.setProperty(
    '--palette-gradient',
    `linear-gradient(90deg, ${colorArr.join(', ')})`
  );
  document.documentElement.style.setProperty('--palette-lead', colorArr[3]);
  document.querySelectorAll('#palette-options .opt').forEach(b =>
    b.classList.toggle('active', b.dataset.id === id)
  );
  document.documentElement.dataset.palette = id;
}

setPalette('pale-bloom');

/* ─── MODAL ─── */
function openModal(id) {
  const p = PROJECTS.find(x => x.id === id);
  const tile = document.querySelector(`.tile[data-id="${id}"]`);
  const tileColor = tile ? getComputedStyle(tile).getPropertyValue('--tile-accent').trim() : '';

  const sheet = document.getElementById('modal-sheet');
  if (tileColor) sheet.style.setProperty('--tile-accent', tileColor);

  document.getElementById('modal-bar-num').textContent = '// ' + p.num + ' · ' + p.title;
  document.getElementById('modal-body-inner').innerHTML = renderProjectDetail(p);
  document.getElementById('modal-backdrop').classList.add('open');
  sheet.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
  document.getElementById('modal-sheet').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else closeModal();
  }
});

/* ─── IMAGE LIGHTBOX ─── */
document.addEventListener('click', e => {
  const img = e.target.closest('.modal-sheet .p-photo img');
  if (!img) return;
  openLightbox(img.src, img.alt || '');
});

function openLightbox(src, caption) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-img').alt = caption;
  document.getElementById('lightbox-caption').textContent = caption;
  lb.classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
