<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2055"/>
      <stop offset="100%" stop-color="#1d0e35"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a87895" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#a87895" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="chassis" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e8c0c8"/>
      <stop offset="35%"  stop-color="#dba8b2"/>
      <stop offset="70%"  stop-color="#c9909c"/>
      <stop offset="100%" stop-color="#a87080"/>
    </linearGradient>

    <linearGradient id="silverPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#453a40"/>
      <stop offset="18%"  stop-color="#6e5e66"/>
      <stop offset="38%"  stop-color="#a8949c"/>
      <stop offset="49%"  stop-color="#e8dce2"/>
      <stop offset="50%"  stop-color="#f6eef2"/>
      <stop offset="51%"  stop-color="#e8dce2"/>
      <stop offset="62%"  stop-color="#a8949c"/>
      <stop offset="82%"  stop-color="#6e5e66"/>
      <stop offset="100%" stop-color="#453a40"/>
    </linearGradient>

    <radialGradient id="silverBall" cx="38%" cy="30%" r="62%">
      <stop offset="0%"   stop-color="#f6eef2"/>
      <stop offset="42%"  stop-color="#e8dce2"/>
      <stop offset="72%"  stop-color="#a8949c"/>
      <stop offset="100%" stop-color="#6e5e66"/>
    </radialGradient>

    <linearGradient id="silverV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#a8949c"/>
      <stop offset="52%"  stop-color="#6e5e66"/>
      <stop offset="100%" stop-color="#453a40"/>
    </linearGradient>

    <linearGradient id="tread" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#a8949c"/>
      <stop offset="45%"  stop-color="#6e5e66"/>
      <stop offset="100%" stop-color="#453a40"/>
    </linearGradient>
    <!-- Teal eye glow — matches the React Robot's CSS filter exactly. -->
    <filter id="eye-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#7fdbca" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#7fdbca" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#bg)"/>
  <rect width="400" height="480" fill="url(#glowBg)"/>

  <!-- ANTENNA: bent pink stem with mint glow ball at tip -->
  <path d="M200 116 L200 78 Q200 62 218 56" fill="none" stroke="#a87080" stroke-width="5" stroke-linecap="round"/>
  <circle cx="222" cy="54" r="18" fill="#7fdbca" opacity="0.22"/>
  <circle cx="222" cy="54" r="11" fill="#7fdbca" opacity="0.38"/>
  <circle cx="222" cy="54" r="8"  fill="#7fdbca"/>
  <circle cx="219" cy="51" r="2.5" fill="#fffaff" opacity="0.65"/>

  <!-- HEAD chassis — very rounded corners for the pill-like silhouette -->
  <rect x="105" y="115" width="190" height="135" rx="62" fill="url(#chassis)" stroke="#a87080" stroke-width="3"/>

  <!-- HEAD inner screen -->
  <rect x="120" y="130" width="160" height="110" rx="50" fill="#0c1220"/>

  <!-- EYES — solid mint discs with teal glow filter (matches React renderEyes default case) -->
  <circle cx="170" cy="188" r="22" fill="#7fdbca" filter="url(#eye-glow)"/>
  <circle cx="163" cy="180" r="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="230" cy="188" r="22" fill="#7fdbca" filter="url(#eye-glow)"/>
  <circle cx="223" cy="180" r="5" fill="#ffffff" opacity="0.4"/>

  <!-- Smile lives only in the projects.html inline copy where CSS can
       reveal it during the wave-on-hover animation. Standalone file
       stays smile-less to match Spocket's default resting state. -->

  <!-- NECK -->
  <rect x="184" y="250" width="32" height="16" rx="3" fill="url(#silverV)" stroke="#453a40" stroke-width="1"/>

  <!-- BODY chassis -->
  <rect x="118" y="264" width="164" height="130" rx="22" fill="url(#chassis)" stroke="#6e5e66" stroke-width="2.5"/>

  <!-- SPOCKET branding -->
  <text x="200" y="298" text-anchor="middle" fill="#453a40"
        font-family="'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="3.5">SPOCKET</text>

  <!-- Body utility panel (central black screen) -->
  <rect x="170" y="338" width="60" height="42" rx="6" fill="#0a0f18" stroke="#453a40" stroke-width="2"/>
  <circle cx="200" cy="359" r="4" fill="#6e5e66"/>

  <!-- Silver bolts at body corners -->
  <circle cx="128" cy="274" r="3.5" fill="url(#silverBall)" stroke="#453a40" stroke-width="0.5"/>
  <circle cx="272" cy="274" r="3.5" fill="url(#silverBall)" stroke="#453a40" stroke-width="0.5"/>
  <circle cx="128" cy="384" r="3.5" fill="url(#silverBall)" stroke="#453a40" stroke-width="0.5"/>
  <circle cx="272" cy="384" r="3.5" fill="url(#silverBall)" stroke="#453a40" stroke-width="0.5"/>

  <!-- ARMS — all-silver: shoulder ball, single cylindrical pipe with bright
       horizontal shine, and a wrist-mounted silver claw (no elbow). Matches
       the React Robot rendering. -->
  <g transform="translate(108, 282)">
    <g class="spocket-arm-left" style="transform-box: fill-box; transform-origin: 50% 10%; transform: rotate(8deg);">
      <circle cx="14" cy="7" r="12" fill="url(#silverBall)" stroke="#453a40" stroke-width="1.5"/>
      <rect x="8" y="19" width="12" height="52" rx="6" fill="url(#silverPipe)" stroke="#453a40" stroke-width="1"/>
      <rect x="6" y="71" width="16" height="5" rx="1.5" fill="#a8949c" stroke="#453a40" stroke-width="1"/>
      <circle cx="9"  cy="76" r="2.2" fill="#a8949c" stroke="#453a40" stroke-width="0.7"/>
      <circle cx="19" cy="76" r="2.2" fill="#a8949c" stroke="#453a40" stroke-width="0.7"/>
      <line x1="9"  y1="78" x2="3"  y2="89" stroke="#6e5e66" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="3"  y1="89" x2="6"  y2="100" stroke="#6e5e66" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="3"  cy="89" r="2" fill="#a8949c" stroke="#453a40" stroke-width="0.7"/>
      <line x1="19" y1="78" x2="25" y2="89" stroke="#6e5e66" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="25" y1="89" x2="22" y2="100" stroke="#6e5e66" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="25" cy="89" r="2" fill="#a8949c" stroke="#453a40" stroke-width="0.7"/>
    </g>
  </g>

  <g transform="translate(264, 282)">
    <g class="spocket-arm-right" style="transform-box: fill-box; transform-origin: 50% 10%; transform: rotate(-8deg);">
      <circle cx="14" cy="7" r="12" fill="url(#silverBall)" stroke="#453a40" stroke-width="1.5"/>
      <rect x="8" y="19" width="12" height="52" rx="6" fill="url(#silverPipe)" stroke="#453a40" stroke-width="1"/>
      <rect x="6" y="71" width="16" height="5" rx="1.5" fill="#a8949c" stroke="#453a40" stroke-width="1"/>
      <circle cx="9"  cy="76" r="2.2" fill="#a8949c" stroke="#453a40" stroke-width="0.7"/>
      <circle cx="19" cy="76" r="2.2" fill="#a8949c" stroke="#453a40" stroke-width="0.7"/>
      <line x1="9"  y1="78" x2="3"  y2="89" stroke="#6e5e66" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="3"  y1="89" x2="6"  y2="100" stroke="#6e5e66" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="3"  cy="89" r="2" fill="#a8949c" stroke="#453a40" stroke-width="0.7"/>
      <line x1="19" y1="78" x2="25" y2="89" stroke="#6e5e66" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="25" y1="89" x2="22" y2="100" stroke="#6e5e66" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="25" cy="89" r="2" fill="#a8949c" stroke="#453a40" stroke-width="0.7"/>
    </g>
  </g>

  <!-- TREADS — matches the React Robot rendering: silver platform bar,
       two dark rounded-rectangle wheels at the corners (poking out 3px
       sideways and 5px below the bar), each with 3 horizontal tread ridges. -->
  <rect x="127" y="392" width="146" height="28" rx="8" fill="url(#tread)" stroke="#453a40" stroke-width="1.5"/>
  <line x1="135" y1="394" x2="265" y2="394" stroke="#fffaf3" stroke-width="0.6" opacity="0.35"/>
  <!-- Left wheel + tread ridges -->
  <rect x="121" y="401" width="60" height="32" rx="15" fill="#2c2629" stroke="#453a40" stroke-width="2"/>
  <line x1="125" y1="409" x2="177" y2="409" stroke="#6e5e66" stroke-width="3" opacity="0.45"/>
  <line x1="125" y1="417" x2="177" y2="417" stroke="#6e5e66" stroke-width="3" opacity="0.45"/>
  <line x1="125" y1="425" x2="177" y2="425" stroke="#6e5e66" stroke-width="3" opacity="0.45"/>
  <!-- Right wheel + tread ridges -->
  <rect x="219" y="401" width="60" height="32" rx="15" fill="#2c2629" stroke="#453a40" stroke-width="2"/>
  <line x1="223" y1="409" x2="275" y2="409" stroke="#6e5e66" stroke-width="3" opacity="0.45"/>
  <line x1="223" y1="417" x2="275" y2="417" stroke="#6e5e66" stroke-width="3" opacity="0.45"/>
  <line x1="223" y1="425" x2="275" y2="425" stroke="#6e5e66" stroke-width="3" opacity="0.45"/>
</svg>
