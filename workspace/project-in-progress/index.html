<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Projects — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --accent:#ef9eba; --mint:#7fdbca; --text:#f6f1fb; --muted:#aea3bb; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:28px; color:var(--text); font-family:Outfit,sans-serif; background:radial-gradient(circle at 20% 15%,#2b173d 0,transparent 42%),radial-gradient(circle at 82% 84%,#13332e 0,transparent 38%),#090610; }
    main { width:min(720px,100%); padding:clamp(28px,7vw,64px); border:1px solid rgba(239,158,186,.24); border-radius:36px; background:rgba(28,15,42,.86); box-shadow:0 30px 100px rgba(0,0,0,.45); }
    .bubble { width:92px; height:92px; display:grid; place-items:center; margin-bottom:26px; font-size:40px; border-radius:50%; background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.26),rgba(239,158,186,.12) 46%,rgba(0,0,0,.08)); border:1px solid rgba(255,255,255,.14); box-shadow:0 18px 42px rgba(0,0,0,.3); }
    .eyebrow { color:var(--accent); font:600 10px "JetBrains Mono",monospace; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:10px 0 14px; font:700 clamp(42px,8vw,76px)/.98 Sora,sans-serif; letter-spacing:-.06em; }
    p { margin:0; max-width:570px; color:var(--muted); font-size:18px; line-height:1.6; }
    a { display:inline-block; margin-top:30px; padding:11px 16px; color:#071512; font:600 11px "JetBrains Mono",monospace; text-decoration:none; border-radius:999px; background:var(--mint); }
  </style>
</head>
<body>
  <main>
    <div class="bubble" aria-hidden="true">🛠️</div>
    <div class="eyebrow">Workspace · protected staging area</div>
      <h1>Projects</h1>
    <p>This space is ready for prototypes, experiments, and work that is still taking shape. Project cards and working files can be added here as they become active.</p>
    <a href="../">← Back to Workspace</a>
  </main>
</body>
</html>
