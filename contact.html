<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Talia Mekhayche</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Sora:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ─── AURORA ROYAL THEME (matches home + projects + resume) ─── */
  :root {
    --bg: #170a1c;
    --deep: #21102a;
    --panel: #2e1640;
    --panel-hi: #3d2055;
    --border: #4a2a68;
    --border2: #6f44a0;
    --accent: #c084fc;
    --accent-2: #fbbf24;
    --pink: #e879f9;
    --text: #ecdef7;
    --text-muted: #b09bc8;
    --text-dim: #7a6588;
    --white: #fffaf3;
    --grid-1: rgba(192, 132, 252, 0.045);
    --grid-2: rgba(251, 191, 36, 0.025);
    --grid-3: rgba(192, 132, 252, 0.055);
    --tag-font: 'Roboto Mono', monospace;
    --palette-gradient: linear-gradient(90deg, #fce7f3, #fbcfe8, #f9a8d4, #f0a3c9, #e88dbb, #db77a8);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Outfit', sans-serif; font-weight: 300;
    line-height: 1.7; min-height: 100vh;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--grid-1) 1px, transparent 2px),
      linear-gradient(90deg, var(--grid-2) 1px, transparent 2px),
      linear-gradient(var(--grid-3) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-2) 1px, transparent 2px);
    background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    pointer-events: none; z-index: 0;
  }

  /* ─── NAV ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 48px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo {
    font-family: 'Sora', sans-serif; font-weight: 700;
    font-size: 22px; letter-spacing: -0.01em;
    color: var(--white); text-decoration: none;
  }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 4px; list-style: none; }
  .nav-links a {
    padding: 7px 15px;
    font-family: var(--tag-font); font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase;
    text-decoration: none; color: var(--text-muted); border-radius: 4px;
    transition: color 0.2s, background 0.2s;
  }
  .nav-links a:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .nav-links a.active { color: var(--accent); }

  /* Contact = primary CTA. Pastel pink pill that matches the page CTAs. */
  .nav-links a.contact-cta {
    margin-left: 6px;
    padding: 7px 16px;
    color: #3d1f47;
    background: linear-gradient(100deg, #fce7f3 0%, #fbcfe8 50%, #f9a8d4 100%);
    font-weight: 700;
    border-radius: 999px;
    box-shadow: 0 2px 10px rgba(249, 168, 212, 0.30);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .nav-links a.contact-cta:hover {
    color: #3d1f47;
    background: linear-gradient(100deg, #fce7f3 0%, #fbcfe8 50%, #f9a8d4 100%);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(249, 168, 212, 0.50);
  }
  .nav-links a.contact-cta.active {
    color: #3d1f47;
    box-shadow: 0 0 0 1px #3d1f47, 0 4px 14px rgba(249, 168, 212, 0.45);
  }

  /* ─── MAIN ─── */
  main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 100px 32px 60px;
    position: relative; z-index: 1;
  }
  .contact-wrap {
    max-width: 760px; width: 100%;
    text-align: center;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: var(--tag-font);
    font-size: 12px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 28px;
  }
  .eyebrow::before, .eyebrow::after {
    content: ''; width: 32px; height: 1px; background: var(--accent);
  }

  h1 {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: clamp(56px, 9vw, 110px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--white);
    margin-bottom: 22px;
  }
  h1 .accent { color: var(--accent); }

  .lede {
    font-size: 18px;
    color: var(--text);
    max-width: 540px;
    margin: 0 auto 32px;
    line-height: 1.7;
  }
  .lede strong { color: var(--accent); font-weight: 500; }

  .divider {
    width: 60px; height: 2px;
    background: var(--palette-gradient);
    border-radius: 2px;
    margin: 0 auto 32px;
  }

  /* ─── AVAILABILITY PILL ─── */
  .availability {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--tag-font);
    font-size: 12px;
    color: #c8f5d8;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: rgba(134, 239, 172, 0.10);
    border: 1px solid rgba(134, 239, 172, 0.40);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 50px;
    font-weight: 600;
  }
  .availability .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #86efac;
    box-shadow: 0 0 0 0 rgba(134, 239, 172, 0.6);
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(134, 239, 172, 0.6); }
    100% { box-shadow: 0 0 0 8px rgba(134, 239, 172, 0); }
  }

  /* ─── CONTACT CARDS ─── */
  .cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    max-width: 700px;
    margin: 0 auto;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 26px;
    text-decoration: none;
    color: inherit;
    font-family: inherit;
    transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 14px;
    text-align: left;
    cursor: pointer;
    width: 100%;
  }
  button.card { font: inherit; }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent),
      0 18px 50px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .card-icon {
    width: 44px; height: 44px;
    background: color-mix(in srgb, var(--accent) 12%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .card-icon svg { width: 20px; height: 20px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
  .card-label {
    font-family: var(--tag-font);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .card-value {
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--white);
    letter-spacing: -0.005em;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  /* Bigger value for the LinkedIn card since "Talia Mekhayche" fits comfortably */
  .card.linkedin-card .card-value {
    font-size: 22px;
  }
  /* Brief "Copied" toast that swaps in for the arrow after clicking the email card */
  .card .card-arrow.copied {
    color: #86efac;
  }
  .card-arrow {
    align-self: flex-end;
    font-family: var(--tag-font);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: auto;
    transition: color 0.2s, transform 0.25s;
  }
  .card:hover .card-arrow { color: var(--accent); transform: translateX(3px); }

  /* ─── BACK LINK ─── */
  .back-link {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 60px;
    padding: 12px 26px;
    font-family: var(--tag-font);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #3d1f47;
    text-decoration: none;
    border-radius: 999px;
    background: linear-gradient(100deg, #fce7f3 0%, #fbcfe8 50%, #f9a8d4 100%);
    box-shadow: 0 6px 22px rgba(249, 168, 212, 0.30);
    font-weight: 700;
    transition: transform 0.25s, box-shadow 0.25s;
  }
  .back-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(249, 168, 212, 0.45);
  }

  /* ─── FOOTER ─── */
  footer {
    text-align: center;
    padding: 28px 32px;
    border-top: 1px solid var(--border);
    font-family: var(--tag-font);
    font-size: 11px;
    color: var(--text-muted);
    position: relative; z-index: 1;
  }

  @media (max-width: 720px) {
    nav { padding: 0 20px; }
    .nav-links a { padding: 6px 10px; font-size: 11px; }
    main { padding: 100px 20px 40px; }
    h1 { font-size: clamp(48px, 12vw, 80px); }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">T.<span>M</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="notes/">Student Resources</a></li>
    <li><a href="contact.html" class="contact-cta active">Contact</a></li>
  </ul>
</nav>

<main>
  <div class="contact-wrap">
    <div class="eyebrow">Get in touch</div>

    <h1>Let's <span class="accent">build</span><br>something.</h1>

    <div class="divider"></div>

    <p class="lede">
      Open to <strong>internships</strong>, <strong>CO-OP positions</strong>, and interesting engineering collaborations.
    </p>

    <div class="availability">
      <span class="pulse"></span>
      Available · 2026
    </div>

    <div class="cards">
      <button type="button" class="card email-card" onclick="copyEmail(this)" aria-label="Copy email address to clipboard">
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
        </div>
        <div>
          <div class="card-label">Email</div>
          <div class="card-value" title="taliamekhayche@gmail.com">taliamekhayche@gmail.com</div>
        </div>
        <div class="card-arrow">Copy →</div>
      </button>

      <a href="https://www.linkedin.com/in/taliamekhayche/" target="_blank" rel="noopener" class="card linkedin-card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3"/><line x1="7" y1="10" x2="7" y2="17"/><circle cx="7" cy="6.5" r="1" fill="currentColor" stroke="none"/><path d="M11 10v7M11 13.5c0-2 1.2-3.5 3-3.5s3 1.5 3 3.5V17"/></svg>
        </div>
        <div>
          <div class="card-label">LinkedIn</div>
          <div class="card-value">Talia Mekhayche</div>
        </div>
        <div class="card-arrow">Connect →</div>
      </a>
    </div>

    <a href="projects.html" class="back-link">← Back to projects</a>
  </div>
</main>

<footer>© 2026 Talia Mekhayche</footer>

<script>
  function copyEmail(btn) {
    const email = 'taliamekhayche@gmail.com';
    const arrow = btn.querySelector('.card-arrow');
    const original = arrow ? arrow.textContent : null;
    const showCopied = () => {
      if (!arrow) return;
      arrow.textContent = '✓ Copied';
      arrow.classList.add('copied');
      setTimeout(() => {
        arrow.textContent = original;
        arrow.classList.remove('copied');
      }, 1800);
    };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = email;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showCopied(); } catch (e) {}
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(email).then(showCopied).catch(fallback);
    } else {
      fallback();
    }
  }
</script>

</body>
</html>
