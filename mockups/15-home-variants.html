<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup 15 · Home Variants — Talia Mekhayche</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060d1a;
    --deep: #0a1628;
    --panel: #111e33;
    --panel-hi: #142a48;
    --border: #1e3555;
    --border2: #2c4d7a;
    --accent: #4dd0e8;
    --accent-2: #4d9fff;
    --gold: #ffb547;
    --text: #c5d6ee;
    --text-muted: #7a95bb;
    --text-dim: #4f6485;
    --white: #f0f5ff;
    --grid-1: rgba(82, 117, 174, 0.039);
    --grid-2: rgba(84, 141, 227, 0.053);
    --grid-3: rgba(43, 128, 255, 0.064);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Outfit', sans-serif; font-weight: 300; line-height: 1.7;
    overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--grid-1) 1px, transparent 2px),
      linear-gradient(90deg, var(--grid-2) 1px, transparent 2px),
      linear-gradient(var(--grid-3) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-2) 1px, transparent 2px);
    background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    pointer-events: none; z-index: 0;
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(6,13,26,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 48px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.1em; color: var(--white); text-decoration: none; }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 4px; list-style: none; }
  .nav-links a {
    padding: 7px 15px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase;
    text-decoration: none; color: var(--text-muted); border-radius: 4px;
  }
  .nav-links a:hover { color: var(--accent); }

  /* PICKER (sticky) */
  .picker-bar {
    position: sticky;
    top: 64px;
    z-index: 50;
    background: rgba(6,13,26,0.95);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
  }
  .picker-bar-inner {
    max-width: 1340px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .picker-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    flex-shrink: 0;
  }
  .picker-options {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .pv-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .pv-btn:hover { border-color: var(--border2); color: var(--white); }
  .pv-btn.active {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--panel));
    color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .pv-btn .num {
    color: var(--text-muted);
    font-weight: 400;
  }
  .pv-btn.active .num { color: var(--accent); }

  /* HERO container — host for variants */
  #home {
    min-height: calc(100vh - 64px - 60px);
    padding: 80px 32px;
    max-width: 1340px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ── SHARED HERO PRIMITIVES ── */
  .home-tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 24px;
  }
  .home-tag::before { content: ''; width: 24px; height: 1px; background: var(--accent); }

  .hero-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(56px, 9vw, 110px);
    line-height: 0.95;
    letter-spacing: 0.03em;
    color: var(--white);
    margin-bottom: 8px;
    font-weight: 400;
  }
  .hero-name .accent { color: var(--accent); }

  .hero-role {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    margin-bottom: 36px;
  }

  .hero-divider {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    margin-bottom: 28px;
  }

  .hero-bio {
    font-size: 16px;
    line-height: 1.8;
    color: var(--text);
    max-width: 620px;
    margin-bottom: 14px;
  }
  .hero-bio strong { color: var(--accent); font-weight: 500; }

  .hero-cta {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 36px; padding: 13px 28px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--accent);
    border-radius: 4px; text-decoration: none;
    transition: background 0.2s;
  }
  .hero-cta:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }

  .hero-stats {
    display: flex; gap: 40px;
    margin-top: 56px;
    padding-top: 36px;
    border-top: 1px solid var(--border);
  }
  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--accent);
    letter-spacing: 0.05em;
    line-height: 1;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ─── V1 — ORIGINAL ─── */
  .v1 .home-inner { max-width: 760px; }

  /* ─── V2 — CARD PANEL ─── */
  .v2 .home-inner {
    max-width: 880px;
    margin: 40px auto 0;
    padding: 60px 56px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    position: relative;
  }
  .v2 .home-inner::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 2px;
    background: var(--accent);
    border-radius: 2px;
  }
  .v2 .hero-stats { margin-top: 40px; padding-top: 28px; }

  /* ─── V3 — TWO-COLUMN ─── */
  .v3 .home-inner { max-width: 1180px; margin: 0 auto; }
  .v3 .hero-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: start;
    margin-bottom: 50px;
  }
  .v3 .hero-stats { margin-top: 0; padding-top: 36px; gap: 60px; }
  .v3 .hero-cta { margin-top: 28px; }
  .v3 .hero-bio { max-width: none; }

  /* ─── V4 — CENTERED MINIMAL ─── */
  .v4 .home-inner { max-width: 740px; margin: 60px auto 0; text-align: center; }
  .v4 .home-tag::before { display: none; }
  .v4 .home-tag { margin-left: auto; margin-right: auto; }
  .v4 .hero-name {
    font-size: clamp(48px, 7vw, 86px);
    margin-bottom: 18px;
  }
  .v4 .hero-role { margin-bottom: 32px; }
  .v4 .hero-divider { margin-left: auto; margin-right: auto; }
  .v4 .hero-bio { margin-left: auto; margin-right: auto; }
  .v4 .hero-stats {
    justify-content: center;
    gap: 60px;
    margin-top: 50px;
    padding-top: 32px;
  }

  /* ─── V5 — STAT-FORWARD ─── */
  .v5 .home-inner { max-width: 880px; }
  .v5 .stats-banner {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 50px;
  }
  .v5 .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 28px;
    position: relative;
    overflow: hidden;
  }
  .v5 .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--accent);
  }
  .v5 .stat-card .num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    color: var(--accent);
    line-height: 1;
    letter-spacing: 0.04em;
  }
  .v5 .stat-card .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 8px;
  }
  .v5 .hero-name { font-size: clamp(42px, 6vw, 78px); margin-bottom: 14px; }
  .v5 .hero-role { margin-bottom: 28px; }
  .v5 .hero-stats { display: none; }

  /* ─── V6 — ANNOTATED BLUEPRINT ─── */
  .v6 .home-inner {
    max-width: 1060px;
    margin: 30px auto 0;
    padding: 60px 56px;
    border: 1px solid var(--border);
    position: relative;
  }
  .v6 .home-inner::before, .v6 .home-inner::after,
  .v6 .corner-tl, .v6 .corner-br {
    position: absolute;
    width: 24px; height: 24px;
    border: 2px solid var(--accent);
  }
  .v6 .home-inner::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
  .v6 .home-inner::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
  .v6 .annot {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .v6 .annot-tl { top: -10px; left: 30px; background: var(--bg); padding: 0 8px; }
  .v6 .annot-tr { top: -10px; right: 30px; background: var(--bg); padding: 0 8px; }
  .v6 .annot-bl { bottom: -10px; left: 30px; background: var(--bg); padding: 0 8px; }
  .v6 .measure {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.1em;
    display: flex; align-items: center;
    gap: 6px;
    margin: 20px 0;
  }
  .v6 .measure::before, .v6 .measure::after {
    content: ''; flex: 0 0 30px; height: 1px; background: var(--accent);
  }
  .v6 .measure::after { flex: 1; max-width: 200px; }

  /* ─── V7 — VERTICAL NAME RAIL ─── */
  .v7 .home-inner {
    max-width: 1240px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 60px;
    align-items: center;
  }
  .v7 .name-rail {
    border-left: 2px solid var(--accent);
    padding-left: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    position: relative;
  }
  .v7 .name-rail .first {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(80px, 12vw, 160px);
    line-height: 0.85;
    color: var(--white);
    letter-spacing: 0.02em;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }
  .v7 .name-rail .second {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(80px, 12vw, 160px);
    line-height: 0.85;
    color: var(--accent);
    letter-spacing: 0.02em;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }
  .v7 .v7-content { max-width: 620px; }

  /* ─── V8 — HERO BENTO ─── */
  .v8 .home-inner {
    max-width: 1240px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 130px;
    gap: 14px;
    margin: 30px auto 0;
  }
  .v8 .hb-cell {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .v8 .hb-name { grid-column: span 4; grid-row: span 2; padding: 36px 40px; }
  .v8 .hb-name .home-tag { margin-bottom: 16px; }
  .v8 .hb-name .hero-name { font-size: clamp(48px, 8vw, 96px); margin-bottom: 8px; }
  .v8 .hb-role { grid-column: span 2; padding: 24px 28px; }
  .v8 .hb-role .hero-role { margin-bottom: 0; }
  .v8 .hb-cta { grid-column: span 2; padding: 24px 28px; display: flex; align-items: center; }
  .v8 .hb-cta .hero-cta { margin: 0; width: 100%; justify-content: center; }
  .v8 .hb-bio { grid-column: span 4; grid-row: span 2; padding: 32px 40px; overflow-y: auto; }
  .v8 .hb-bio .hero-bio { max-width: none; margin-bottom: 12px; }
  .v8 .hb-stat { grid-column: span 2; padding: 24px 28px; display: flex; flex-direction: column; justify-content: center; }
  .v8 .hb-stat .stat-num { font-size: 44px; }

  /* ─── V9 — COVER PANEL SPLIT ─── */
  .v9 .home-inner {
    max-width: 1240px;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 50px;
    align-items: center;
  }
  .v9 .v9-text {
    padding: 30px 0;
  }
  .v9 .v9-cover {
    aspect-ratio: 4/5;
    border: 1px solid var(--border);
    border-radius: 18px;
    background:
      radial-gradient(ellipse at 0% 100%, color-mix(in srgb, var(--accent-2) 18%, transparent), transparent 55%),
      radial-gradient(ellipse at 100% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 55%),
      var(--panel);
    position: relative;
    overflow: hidden;
  }
  .v9 .v9-cover::before {
    content: 'TM';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 280px;
    color: color-mix(in srgb, var(--accent) 30%, transparent);
    line-height: 1;
    letter-spacing: 0.04em;
  }
  .v9 .v9-cover::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, color-mix(in srgb, var(--text) 18%, transparent) 1px, transparent 1.5px);
    background-size: 26px 26px;
    opacity: 0.32;
  }
  .v9 .v9-cover-tag {
    position: absolute;
    top: 24px; left: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--accent);
    text-transform: uppercase;
    z-index: 2;
  }
  .v9 .v9-cover-tag::before { content: '// '; }
  .v9 .v9-cover-foot {
    position: absolute;
    bottom: 24px; left: 24px; right: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    z-index: 2;
    display: flex; justify-content: space-between;
  }

  /* ─── V10 — ARCHITECT TYPOGRAPHY ─── */
  .v10 .home-inner { max-width: 1080px; }
  .v10 .hero-name {
    font-family: 'Outfit', sans-serif;
    font-weight: 200;
    font-size: clamp(48px, 8vw, 92px);
    letter-spacing: 0.12em;
    line-height: 1.0;
    text-transform: uppercase;
  }
  .v10 .hero-name .accent { color: var(--accent); font-weight: 300; }
  .v10 .v10-coord {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .v10 .v10-coord .a { color: var(--accent); }
  .v10 .hero-divider { width: 120px; height: 1px; background: var(--accent); margin: 32px 0; }
  .v10 .hero-bio { font-weight: 300; line-height: 1.85; }
  .v10 .hero-stats { gap: 80px; }
  .v10 .stat-num { font-family: 'Outfit', sans-serif; font-weight: 200; font-size: 52px; letter-spacing: 0.04em; }

  /* SECTION BREAK + PROJECTS PREVIEW */
  .section-break {
    position: relative; z-index: 1;
    max-width: 1100px; margin: 0 auto;
    padding: 32px 32px 0;
    display: flex; align-items: center; gap: 18px;
  }
  .section-break .line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border2), transparent);
  }
  .section-break .tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
  }
  .section-break .tag::before { content: '↓ '; }

  .projects-preview {
    max-width: 1340px; margin: 0 auto;
    padding: 50px 32px 80px;
    position: relative; z-index: 1;
  }
  .projects-preview::before {
    content: ''; position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 60px; height: 2px;
    background: var(--accent); border-radius: 2px;
  }
  .pp-header {
    display: flex; align-items: baseline; gap: 16px;
    margin-bottom: 28px;
  }
  .pp-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 0.14em; }
  .pp-title { font-family: 'Bebas Neue', sans-serif; font-size: 56px; color: var(--white); letter-spacing: 0.04em; line-height: 1; font-weight: 400; }
  .pp-line { flex: 1; height: 1px; background: var(--border); align-self: center; }
  .pp-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    height: 220px;
  }
  .pp-tile {
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .pp-tile img { width: 100%; height: 100%; object-fit: cover; }
  .pp-tile::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(6,13,26,0.85) 100%);
  }
  .pp-tile .label {
    position: absolute; bottom: 12px; left: 14px; right: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--white);
    letter-spacing: 0.04em;
    z-index: 2;
  }

  footer {
    text-align: center; padding: 32px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-muted);
    position: relative; z-index: 1;
  }

  @media (max-width: 900px) {
    nav { padding: 0 20px; }
    .nav-links { display: none; }
    .picker-bar { padding: 12px 20px; }
    #home { padding: 60px 20px; }
    .v3 .hero-grid, .v7 .home-inner, .v9 .home-inner { grid-template-columns: 1fr; gap: 40px; }
    .v8 .home-inner { grid-template-columns: repeat(2, 1fr); }
    .v8 .hb-name, .v8 .hb-bio { grid-column: span 2; }
    .v9 .v9-cover { max-width: 360px; margin: 0 auto; }
    .pp-grid { grid-template-columns: 1fr; height: auto; gap: 10px; }
    .pp-tile { height: 120px; }
  }
</style>
</head>
<body>

<nav>
  <a href="#home" class="nav-logo">T.<span>M</span></a>
  <ul class="nav-links">
    <li><a href="#home">Home</a></li>
    <li><a href="#">Projects</a></li>
    <li><a href="../notes/">Student Resources</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<!-- VARIANT PICKER (sticky) -->
<div class="picker-bar">
  <div class="picker-bar-inner">
    <span class="picker-label">Try home design →</span>
    <div class="picker-options" id="picker-options"></div>
  </div>
</div>

<!-- HERO (renders selected variant) -->
<section id="home" class="v1"></section>

<!-- SECTION BREAK -->
<div class="section-break">
  <div class="line"></div>
  <span class="tag">Projects below</span>
  <div class="line"></div>
</div>

<!-- PROJECTS PREVIEW (static — for context, shows how each home transitions) -->
<section class="projects-preview">
  <div class="pp-header">
    <span class="pp-num">// SELECTED WORK</span>
    <h2 class="pp-title">Projects</h2>
    <div class="pp-line"></div>
  </div>
  <div class="pp-grid">
    <div class="pp-tile"><img src="../deskclaw.jpeg" alt=""><div class="label">DeskClaw</div></div>
    <div class="pp-tile"><img src="../sleepapneahardware.jpeg" alt=""><div class="label">Sleep Apnea Detector</div></div>
    <div class="pp-tile"><img src="../columnAB.jpeg" alt=""><div class="label">Water Filter</div></div>
  </div>
</section>

<footer>© 2026 Talia Mekhayche · Mockup 15 · Home Variants</footer>

<script>
const variants = [
  { n: 1, name: 'Original', desc: 'Single column, current' },
  { n: 2, name: 'Card panel', desc: 'Wrapped in tile' },
  { n: 3, name: 'Two-column', desc: 'Identity + bio split' },
  { n: 4, name: 'Centered', desc: 'Symmetrical, minimal' },

</div>`;

function setVariant(n) {
